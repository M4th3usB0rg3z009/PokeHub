<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>PokéHub</title>

      content="Consulte informações completas sobre Pokémon, monte equipes, analise fraquezas, descubra golpes e gere builds com inteligência artificial."
    />

    <meta
      name="theme-color"
      content="#ef233c"
    />

    <meta
      name="author"
      content="Matheus Borges"
    />

    <meta
      property="og:title"
      content="PokéHub" 
    />

      content="Descubra informações completas sobre qualquer Pokémon, monte equipes e receba análises inteligentes com IA."

    />

      name="twitter:image"
      content="/pokehub-preview.png"
    />

      rel="icon"

    />
